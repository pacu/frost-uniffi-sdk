[workspace]
members = ["uniffi-bindgen", "frost-uniffi-sdk"]
resolver = "2"

[workspace.dependencies]
uniffi = "0.31.0"
async-trait = "0.1.77"
eyre = "0.6.12"
frost-core = { version = "2.2", features = ["serde"] }
frost-ed25519 = { version = "2.2", features = ["serde"] }
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost", "serde"] }
hex = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
rand = "0.8"
serde_json = "1.0"
itertools = "0.14.0"
tokio = { version = "1", features = ["full"] }
message-io = "0.18"



[profile.release]
lto = true
panic = 'abort'
codegen-units = 1
